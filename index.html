<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake & Filling | Professional Showcase</title>
    
    <!-- Importing elegant font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Minimalist and Luxurious Color Palette */
            --bg-color: #faf8f5;        /* Elegant off-white background */
            --text-main: #2c2c2c;       /* Dark gray, softer than black */
            --text-light: #7a7a7a;      /* Light gray for subtitles */
            --card-radius: 12px;        /* Smooth rounded borders */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif; /* Clean and modern font */
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif; /* Serif font, magazine style */
            font-size: 2.8rem;
            font-weight: 400;
            margin: 0 0 10px;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* SHOWCASE AREA */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* PINTEREST STYLE STRUCTURE (MASONRY GRID) */
        .masonry-grid {
            column-count: 3; /* Changed to 3 columns to fit the 3 images perfectly on desktop */
            column-gap: 20px;
        }

        /* Responsiveness (Screen sizes) */
        @media (max-width: 1024px) {
            .masonry-grid { column-count: 3; } /* 3 columns on tablets */
        }
        @media (max-width: 768px) {
            .masonry-grid { column-count: 2; } /* 2 columns on landscape phones */
        }
        @media (max-width: 480px) {
            .masonry-grid { column-count: 1; } /* 1 column on regular phones for larger display of these 3 specific items */
            header { padding: 40px 20px 30px; }
            h1 { font-size: 2.2rem; }
        }

        /* PRODUCT CARD */
        .grid-item {
            display: inline-block; /* Prevents item from being cut between columns */
            width: 100%;
            margin-bottom: 20px;
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #eee; /* Background color while image loads */
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .grid-item:hover {
            transform: translateY(-5px); /* Hover levitation effect */
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* THE LINK (Conversion Magic) */
        .grid-item a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .grid-item img {
            width: 100%;
            display: block;
            border-radius: var(--card-radius);
            transition: transform 0.5s ease;
        }

        .grid-item:hover img {
            transform: scale(1.03); /* Slight zoom on image on hover */
        }

        /* DARK OVERLAY ON IMAGE AND TEXT */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0) 100%);
            padding: 25px 20px 20px;
            opacity: 0; /* Invisible by default on desktop */
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            pointer-events: none; /* Lets click pass through to the link */
        }

        .grid-item:hover .overlay {
            opacity: 1; /* Appears on mouse hover */
        }

        .product-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .shop-tag {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.95);
            color: #000;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: max-content;
        }

        /* Exclusive config for mobile (since there is no hover) */
        @media (hover: none) {
            .overlay {
                opacity: 1; /* Always visible on mobile */
                background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 80%);
                padding: 15px 12px 12px;
            }
            .product-title {
                font-size: 0.85rem;
            }
            .shop-tag {
                font-size: 0.65rem;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- PAGE TITLE -->
    <header>
        <h1>Cake & Filling</h1>
        <p class="subtitle">Professional Equipment & Curation</p>
    </header>

    <!-- START OF PINTEREST GRID -->
    <div class="container">
        <div class="masonry-grid">
            
            <!-- ====== PRODUCT 1 (Batedor) ====== -->
            <div class="grid-item">
                <a href="#" target="_blank" rel="noopener noreferrer">
                    <img src="batedor_bolo3_2.png" alt="Professional Whisk Attachment">
                    <div class="overlay">
                        <div class="product-title">Professional Whisk Attachment</div>
                        <div class="shop-tag">View Product</div>
                    </div>
                </a>
            </div>

            <!-- ====== PRODUCT 2 (Suporte/Floating Cake Stand) ====== -->
            <div class="grid-item">
                <a href="#" target="_blank" rel="noopener noreferrer">
                    <img src="suporte.png" alt="Luxury Floating Cake Stand">
                    <div class="overlay">
                        <div class="product-title">Luxury Floating Cake Stand</div>
                        <div class="shop-tag">View Product</div>
                    </div>
                </a>
            </div>

            <!-- ====== PRODUCT 3 (Batedeira) ====== -->
            <div class="grid-item">
                <a href="#" target="_blank" rel="noopener noreferrer">
                    <img src="batedeira.png" alt="Premium Stand Mixer">
                    <div class="overlay">
                        <div class="product-title">Premium Stand Mixer</div>
                        <div class="shop-tag">View Product</div>
                    </div>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
